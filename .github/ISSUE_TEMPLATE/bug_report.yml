name: Bug report
description: Report a reproducible problem with Zotero Deselect
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail to reproduce it.
  - type: input
    id: zotero-version
    attributes:
      label: Zotero version
      placeholder: e.g. 10.0.6
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Zotero Deselect version
      placeholder: e.g. 0.2.8
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you clicked and what happened.
      placeholder: |
        1. Select an item...
        2. Click empty space...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots or short recordings are welcome, but please remove private library information first.
